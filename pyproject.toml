[project]
name = "optmem-mcp"
version = "0.1.0"
description = "MCP server for OptMem, an append-only, self-summarizing memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Reyansh Gupta" }]
dependencies = ["mcp>=1.24,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
optmem-mcp = "optmem_mcp:main"

[project.urls]
Repository = "https://github.com/reyanshgupta/optmem-mcp"
OptMem = "https://github.com/VictorTaelin/OptMem"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["optmem_mcp.py"]
